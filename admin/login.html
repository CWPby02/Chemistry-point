<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Chemistry Point</title>

    <link rel="icon" href="../assets/images/logo/logo.png">

    <link rel="stylesheet" href="../assets/css/root.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(217,154,22,.12), transparent 35%),
                #08090b;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: .3s ease;
        }

        body.light-mode {
            background:
                radial-gradient(circle at top left, rgba(217,154,22,.12), transparent 35%),
                #f5f5f5;
            color: #17191c;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
        }

        .top-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .theme-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(217,154,22,.35);
            background: rgba(255,255,255,.04);
            color: #f3bd45;
            cursor: pointer;
            font-size: 16px;
            transition: .25s ease;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
            background: rgba(217,154,22,.12);
        }

        .login-card {
            background: rgba(19,22,26,.94);
            border: 1px solid rgba(217,154,22,.22);
            border-radius: 24px;
            padding: 35px;
            box-shadow:
                0 25px 70px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.04);
            backdrop-filter: blur(15px);
        }

        body.light-mode .login-card {
            background: rgba(255,255,255,.96);
            border-color: rgba(168,111,0,.2);
            box-shadow: 0 20px 60px rgba(0,0,0,.12);
        }

        .brand-box {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            border-radius: 18px;
            margin-bottom: 15px;
        }

        .brand-title {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }

        .brand-title span {
            color: #d99a16;
        }

        .brand-subtitle {
            margin: 7px 0 0;
            color: #858a93;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #d99a16;
            font-size: 15px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #30343a;
            outline: none;
            padding: 0 45px 0 43px;
            background: #0e1013;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: .25s ease;
        }

        body.light-mode .form-input {
            background: #f7f7f7;
            border-color: #ddd;
            color: #17191c;
        }

        .form-input:focus {
            border-color: #d99a16;
            box-shadow: 0 0 0 3px rgba(217,154,22,.10);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #858a93;
            cursor: pointer;
            font-size: 15px;
        }

        .password-toggle:hover {
            color: #d99a16;
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .forgot-btn {
            border: 0;
            background: transparent;
            color: #d99a16;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            padding: 0;
        }

        .forgot-btn:hover {
            color: #f3bd45;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #a86f00,
                #f3bd45,
                #c98600
            );
            color: #17191c;
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217,154,22,.22);
        }

        .login-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(220,53,69,.10);
            border: 1px solid rgba(220,53,69,.25);
            color: #ff8f9b;
        }

        .message.success {
            background: rgba(25,135,84,.10);
            border: 1px solid rgba(25,135,84,.25);
            color: #69d89e;
        }

        .message.info {
            background: rgba(217,154,22,.10);
            border: 1px solid rgba(217,154,22,.25);
            color: #f3bd45;
        }

        .footer-note {
            text-align: center;
            margin-top: 22px;
            color: #858a93;
            font-size: 11px;
        }

        .footer-note strong {
            color: #d99a16;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border: 2px solid rgba(23,25,28,.25);
            border-top-color: #17191c;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 14px;
            }

            .login-card {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .brand-title {
                font-size: 21px;
            }

        }

    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="top-actions">
            <button
                class="theme-btn"
                id="themeBtn"
                type="button"
                aria-label="Toggle Theme"
            >
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div class="login-card">

            <div class="brand-box">

                <img
                    src="../assets/images/logo/logo.png"
                    alt="Chemistry Point"
                    class="logo"
                >

                <h1 class="brand-title">
                    Chemistry <span>Point</span>
                </h1>

                <p class="brand-subtitle">
                    Admin Panel Login
                </p>

            </div>

            <div
                class="message"
                id="message"
                role="alert"
            ></div>

            <form id="loginForm">

                <div class="form-group">

                    <label class="form-label" for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter admin email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show Password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>

                <div class="form-options">

                    <button
                        type="button"
                        class="forgot-btn"
                        id="forgotBtn"
                    >
                        Forgot Password?
                    </button>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Login to Admin</span>
                </button>

            </form>

        </div>

        <div class="footer-note">
            Built with ❤️ by <strong>Code With Piyush</strong>
        </div>

    </div>


    <!-- Firebase -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        import {
            getDatabase,
            ref,
            get,
            set
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyB6Yaf6K9HpL3q692b20ECPvXu78rUfByU",

            authDomain:
                "chemistry-point-9a41b.firebaseapp.com",

            projectId:
                "chemistry-point-9a41b",

            storageBucket:
                "chemistry-point-9a41b.firebasestorage.app",

            messagingSenderId:
                "791007663942",

            appId:
                "1:791007663942:web:693c008e475a2e74357747"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getDatabase(
            app,
            "https://chemistry-point-9a41b-default-rtdb.asia-southeast1.firebasedatabase.app/"
        );


        /* =========================
           FIRST ADMIN UID
        ========================= */

        const FIRST_ADMIN_UID =
            "swWYszc7mMWQVJrWFFmiNBIV3al2";


        /* =========================
           ELEMENTS
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginBtn =
            document.getElementById("loginBtn");

        const forgotBtn =
            document.getElementById("forgotBtn");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const message =
            document.getElementById("message");

        const themeBtn =
            document.getElementById("themeBtn");


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                `message show ${type}`;

        }


        function hideMessage() {

            message.className = "message";

            message.textContent = "";

        }


        /* =========================
           LOADING
        ========================= */

        function setLoginLoading(loading) {

            loginBtn.disabled = loading;

            if (loading) {

                loginBtn.innerHTML = `
                    <span class="spinner"></span>
                    <span>Checking...</span>
                `;

            } else {

                loginBtn.innerHTML = `
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Login to Admin</span>
                `;

            }

        }


        /* =========================
           AUTO CREATE FIRST ADMIN
        ========================= */

        async function verifyAdmin(user) {

            try {

                const adminRef =
                    ref(
                        db,
                        `admins/${user.uid}`
                    );

                const snapshot =
                    await get(adminRef);


                /*
                 * ADMIN RECORD ALREADY EXISTS
                 */

                if (snapshot.exists()) {

                    const adminData =
                        snapshot.val();


                    if (
                        adminData.role !== "admin"
                    ) {

                        throw new Error(
                            "NOT_ADMIN"
                        );

                    }


                    if (
                        adminData.active === false
                    ) {

                        throw new Error(
                            "INACTIVE_ADMIN"
                        );

                    }


                    return true;

                }


                /*
                 * ADMIN RECORD DOES NOT EXIST
                 *
                 * Only our fixed FIRST_ADMIN_UID
                 * can auto-create itself.
                 */

                if (
                    user.uid !== FIRST_ADMIN_UID
                ) {

                    throw new Error(
                        "NOT_ADMIN"
                    );

                }


                showMessage(
                    "First Admin setup हो रहा है...",
                    "info"
                );


                await set(
                    adminRef,
                    {
                        role: "admin",
                        active: true
                    }
                );


                /*
                 * Verify that Firebase saved it
                 */

                const verifySnapshot =
                    await get(adminRef);


                if (
                    !verifySnapshot.exists()
                ) {

                    throw new Error(
                        "ADMIN_CREATE_FAILED"
                    );

                }


                const createdAdmin =
                    verifySnapshot.val();


                if (
                    createdAdmin.role !== "admin" ||
                    createdAdmin.active !== true
                ) {

                    throw new Error(
                        "ADMIN_CREATE_FAILED"
                    );

                }


                return true;

            } catch (error) {

                console.error(
                    "Admin verification error:",
                    error
                );

                if (
                    error.message === "NOT_ADMIN"
                ) {

                    throw new Error(
                        "यह account Admin Panel के लिए authorized नहीं है।"
                    );

                }

                if (
                    error.message === "INACTIVE_ADMIN"
                ) {

                    throw new Error(
                        "यह admin account currently inactive है।"
                    );

                }

                if (
                    error.message ===
                    "ADMIN_CREATE_FAILED"
                ) {

                    throw new Error(
                        "Admin record create नहीं हो पाया। Firebase Rules check करें।"
                    );

                }


                if (
                    error.code ===
                    "PERMISSION_DENIED"
                ) {

                    throw new Error(
                        "Database permission denied. Firebase Rules check करें।"
                    );

                }


                throw error;

            }

        }


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                hideMessage();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Email और password दोनों डालें।"
                    );

                    return;

                }


                setLoginLoading(true);


                try {

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    await verifyAdmin(
                        credential.user
                    );


                    showMessage(
                        "Login successful! Dashboard खोल रहे हैं...",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let errorMessage =
                        "Login failed. कृपया दोबारा try करें।";


                    if (
                        error.message &&
                        error.message.includes(
                            "authorized"
                        )
                    ) {

                        errorMessage =
                            error.message;

                    } else if (
                        error.message &&
                        error.message.includes(
                            "inactive"
                        )
                    ) {

                        errorMessage =
                            error.message;

                    } else if (
                        error.message &&
                        error.message.includes(
                            "permission"
                        )
                    ) {

                        errorMessage =
                            error.message;

                    } else {

                        switch (error.code) {

                            case "auth/invalid-email":

                                errorMessage =
                                    "Email address सही नहीं है।";

                                break;


                            case "auth/invalid-credential":

                                errorMessage =
                                    "Email या password गलत है।";

                                break;


                            case "auth/user-not-found":

                                errorMessage =
                                    "यह email registered नहीं है।";

                                break;


                            case "auth/wrong-password":

                                errorMessage =
                                    "Password गलत है।";

                                break;


                            case "auth/user-disabled":

                                errorMessage =
                                    "यह Firebase account disabled है।";

                                break;


                            case "auth/too-many-requests":

                                errorMessage =
                                    "बहुत ज्यादा attempts हो गए हैं। थोड़ी देर बाद try करें।";

                                break;


                            case "auth/network-request-failed":

                                errorMessage =
                                    "Internet connection check करें।";

                                break;

                        }

                    }


                    showMessage(
                        errorMessage
                    );

                    setLoginLoading(false);

                }

            }
        );


        /* =========================
           FORGOT PASSWORD
        ========================= */

        forgotBtn.addEventListener(
            "click",
            async () => {

                hideMessage();

                const email =
                    emailInput.value.trim();


                if (!email) {

                    showMessage(
                        "पहले अपना email address डालें।"
                    );

                    emailInput.focus();

                    return;

                }


                forgotBtn.disabled = true;

                forgotBtn.textContent =
                    "Sending...";


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Password reset email भेज दिया गया है। Inbox/Spam check करें।",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        showMessage(
                            "इस email से कोई Firebase account नहीं मिला।"
                        );

                    } else {

                        showMessage(
                            "Password reset email भेजने में problem हुई।"
                        );

                    }

                }


                forgotBtn.disabled = false;

                forgotBtn.textContent =
                    "Forgot Password?";

            }
        );


        /* =========================
           PASSWORD SHOW / HIDE
        ========================= */

        passwordToggle.addEventListener(
            "click",
            () => {

                const icon =
                    passwordToggle.querySelector("i");


                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    icon.classList.remove(
                        "fa-eye"
                    );

                    icon.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    icon.classList.remove(
                        "fa-eye-slash"
                    );

                    icon.classList.add(
                        "fa-eye"
                    );

                }

            }
        );


        /* =========================
           AUTH STATE
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    return;

                }


                try {

                    await verifyAdmin(user);


                    window.location.href =
                        "dashboard.html";


                } catch (error) {

                    console.log(
                        "No authorized admin session."
                    );

                    await signOut(auth);

                }

            }
        );


        /* =========================
           THEME
        ========================= */

        function applyTheme(theme) {

            if (
                theme === "light"
            ) {

                document.body.classList.add(
                    "light-mode"
                );

                themeBtn.innerHTML =
                    `<i class="fa-solid fa-sun"></i>`;

            } else {

                document.body.classList.remove(
                    "light-mode"
                );

                themeBtn.innerHTML =
                    `<i class="fa-solid fa-moon"></i>`;

            }

        }


        const savedTheme =
            localStorage.getItem(
                "chemistryPointTheme"
            ) || "dark";


        applyTheme(savedTheme);


        themeBtn.addEventListener(
            "click",
            () => {

                const isLight =
                    document.body.classList.contains(
                        "light-mode"
                    );


                const newTheme =
                    isLight
                        ? "dark"
                        : "light";


                localStorage.setItem(
                    "chemistryPointTheme",
                    newTheme
                );


                applyTheme(
                    newTheme
                );

            }
        );

    </script>

</body>
</html>
